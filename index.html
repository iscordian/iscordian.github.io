<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body {
            margin: 0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b); /* Dark fallback background */
            color: white;
        }

        /* Fixed Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Scroll Animations */
        .fade-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #f472b6; /* Pink-400 */
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased min-h-screen relative selection:bg-pink-500 selection:text-white">

    <!-- Anime Style Animated Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- App Container (Dynamically Injected) -->
    <div id="app" class="relative z-10 max-w-5xl mx-auto px-6 py-20 min-h-screen flex flex-col">
        <!-- Initial Skeleton / Loader -->
        <div id="loading" class="flex flex-col items-center justify-center flex-grow">
            <div class="loader mb-6"></div>
            <p class="text-white/60 animate-pulse tracking-widest text-sm uppercase">Loading Profile...</p>
        </div>
    </div>

    <!-- Dynamic Cache-Busting Script Loader -->
    <script>
        // 1. Create a new script element
        const mainScript = document.createElement('script');
        
        // 2. Set the source with a unique timestamp to prevent caching
        const uniqueVersion = new Date().getTime();
        mainScript.src = 'script.js?v=' + uniqueVersion;
        //mainScript.src = 'script.js?v=' + uniqueVersion;
        
        // 3. Inject it into the body of the HTML
        document.body.appendChild(mainScript);
    </script>
</body>
</html>

</body>
</html>
